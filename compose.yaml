services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 3s
      timeout: 3s
      retries: 20
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build: { context: ., target: server }
    environment:
      PORT: 3001
      POSTGRES_URL: postgres://game:game@postgres:5432/game
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: elemental_tactics
      WEB_ORIGIN: http://localhost:${GAME_WEB_PORT:-8088}
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
  web:
    build: { context: ., target: web }
    ports: ["${GAME_WEB_PORT:-8088}:80"]
    depends_on: [server]
volumes:
  postgres_data:
  mongo_data:
