<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мир</title><style>
html,body,#world{margin:0;width:100%;height:100%;overflow:hidden;background:#83adbd}canvas{outline:none}#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;text-shadow:0 1px 3px #000;font:24px monospace;pointer-events:none}#hint{position:absolute;inset:0;display:grid;place-content:center;background:#10202977;color:white;text-align:center;font:14px system-ui;pointer-events:none}#hint[hidden]{display:none}

</style></head><body><div id="world"></div><div id="crosshair">+</div><div class="hud hud-top"><p id="position-info"></p><p id="target-info"></p><p id="hp-readout"></p><progress id="block-hp" hidden max="100" value="100" aria-label="Прочность блока"></progress></div><div id="hint">Нажми, чтобы исследовать</div><script type="module" src="/src/features/world/engine/frame.mjs"></script></body></html>
